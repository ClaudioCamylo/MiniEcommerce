name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MiniEcommerce.sln

      - name: Build
        run: dotnet build MiniEcommerce.sln -c Release --no-restore

      - name: Test
        run: dotnet test MiniEcommerce.sln -c Release --no-build --no-restore
